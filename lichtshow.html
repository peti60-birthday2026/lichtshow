<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Geburtstags-Lightshow</title>
<style>
  html, body { margin:0; padding:0; background:#000; overflow:hidden; height:100%; font-family: Arial, sans-serif; }
  #controls {
    position: fixed; top:0; left:0; right:0; z-index:10;
    display:flex; gap:10px; align-items:center; padding:10px 14px;
    background: rgba(0,0,0,0.55); color:#fff; font-size:13px;
    transition: opacity 0.4s;
  }
  #controls.hidden { opacity:0; pointer-events:none; }
  button, select {
    background: rgba(255,255,255,0.12); color:#fff; border:1px solid rgba(255,255,255,0.3);
    border-radius:6px; padding:6px 10px; font-size:13px; cursor:pointer;
  }
  button:hover { background: rgba(255,255,255,0.22); }
  #status { margin-left:auto; opacity:0.85; }
  #stage { position:fixed; top:0; left:0; width:100vw; height:100vh; }
  canvas { position:absolute; top:0; left:0; width:100%; height:100%; }
  #hint { position:fixed; bottom:10px; left:14px; color:rgba(255,255,255,0.4); font-size:11px; z-index:10; }
</style>
</head>
<body>

<div id="controls">
  <button id="btn-mic">Mikrofon</button>
  <button id="btn-file">Datei laden</button>
  <input type="file" id="file-input" accept="audio/*" style="display:none" />
  <button id="btn-stop">Stopp</button>
  <select id="mode-select">
    <option value="auto" selected>Automatisch wechseln</option>
    <option value="waves">Wellen</option>
    <option value="blobs">Weiche Farbflecken</option>
    <option value="circles">Kreis-Balken</option>
    <option value="kaleido">Kaleidoskop</option>
  </select>
  <select id="palette-select">
    <option value="party">Party bunt</option>
    <option value="ice">Eisblau</option>
    <option value="warm">Warmgold</option>
  </select>
  <span id="status">Bereit</span>
</div>

<div id="stage">
  <canvas id="viz"></canvas>
</div>
<div id="hint">Taste H: Steuerung ein/aus &nbsp; | &nbsp; F11: Vollbild (Browser)</div>

<audio id="audio-el" style="display:none"></audio>

<script>
(function(){
  const canvas = document.getElementById('viz');
  const ctx = canvas.getContext('2d');
  const statusEl = document.getElementById('status');
  const btnMic = document.getElementById('btn-mic');
  const btnFile = document.getElementById('btn-file');
  const btnStop = document.getElementById('btn-stop');
  const fileInput = document.getElementById('file-input');
  const audioEl = document.getElementById('audio-el');
  const modeSelect = document.getElementById('mode-select');
  const paletteSelect = document.getElementById('palette-select');
  const controls = document.getElementById('controls');

  let audioCtx, analyser, source, dataArray, bufferLength, rafId, stream;
  let time = 0;
  let particles = [];
  let blobs = [];
  let kParticles = [];

  const MODES = ['waves','blobs','circles','kaleido'];
  let autoMode = true;
  let currentMode = 'waves';

  const palettes = {
    party: { bg:'#050507', hues:[280,190,330,45,160] },
    ice: { bg:'#eef6fa', hues:[190,195,200,175] },
    warm: { bg:'#12080a', hues:[30,40,20,45] }
  };
  let paletteKey = 'party';

  // --- song change detection ---
  let volHistory = [];
  let silenceFrames = 0;
  let lastLoudTime = 0;

  function resize(){
    canvas.width = window.innerWidth * devicePixelRatio;
    canvas.height = window.innerHeight * devicePixelRatio;
    ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  }
  window.addEventListener('resize', resize);
  resize();

  document.addEventListener('keydown', (e) => {
    if (e.key === 'h' || e.key === 'H'){
      controls.classList.toggle('hidden');
    }
  });

  modeSelect.addEventListener('change', () => {
    if (modeSelect.value === 'auto'){ autoMode = true; }
    else { autoMode = false; currentMode = modeSelect.value; resetSceneState(); }
  });
  paletteSelect.addEventListener('change', () => { paletteKey = paletteSelect.value; });

  function resetSceneState(){
    particles = []; kParticles = [];
    const w = window.innerWidth, h = window.innerHeight;
    blobs = [];
    for (let i=0;i<6;i++){
      blobs.push({
        baseX: (0.15+0.7*Math.random())*w, baseY:(0.15+0.7*Math.random())*h,
        angle: Math.random()*Math.PI*2, orbit: 40+Math.random()*70,
        speed: 0.15+Math.random()*0.2, baseR: 90+Math.random()*70,
        phase: Math.random()*Math.PI*2, freqBand: i/6
      });
    }
  }
  resetSceneState();

  function switchToRandomMode(){
    let next = currentMode;
    while (next === currentMode) next = MODES[Math.floor(Math.random()*MODES.length)];
    currentMode = next;
    resetSceneState();
    const palKeys = Object.keys(palettes);
    paletteKey = palKeys[Math.floor(Math.random()*palKeys.length)];
  }

  function setupAnalyser(){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    analyser.smoothingTimeConstant = 0.78;
    bufferLength = analyser.frequencyBinCount;
    dataArray = new Uint8Array(bufferLength);
    volHistory = []; silenceFrames = 0;
    resetSceneState();
  }

  async function startMic(){
    stopAll();
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio:true });
      setupAnalyser();
      source = audioCtx.createMediaStreamSource(stream);
      source.connect(analyser);
      statusEl.textContent = 'Mikrofon aktiv';
      draw();
    } catch(e){ statusEl.textContent = 'Mikrofonzugriff verweigert'; }
  }

  function loadFile(file){
    stopAll();
    const url = URL.createObjectURL(file);
    audioEl.src = url;
    setupAnalyser();
    source = audioCtx.createMediaElementSource(audioEl);
    source.connect(analyser);
    analyser.connect(audioCtx.destination);
    audioEl.play();
    statusEl.textContent = 'Datei: ' + file.name;
    draw();
  }

  function stopAll(){
    if (rafId) cancelAnimationFrame(rafId);
    if (source){ try{source.disconnect();}catch(e){} }
    if (stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
    if (audioCtx){ try{audioCtx.close();}catch(e){} audioCtx=null; }
    audioEl.pause();
    ctx.clearRect(0,0,canvas.width,canvas.height);
  }

  btnMic.addEventListener('click', startMic);
  btnFile.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', (e) => { if (e.target.files[0]) loadFile(e.target.files[0]); });
  btnStop.addEventListener('click', () => { stopAll(); statusEl.textContent = 'Gestoppt'; });

  audioEl.addEventListener('play', () => { if (autoMode) switchToRandomMode(); });

  function detectSongChange(avgVol){
    volHistory.push(avgVol);
    if (volHistory.length > 90) volHistory.shift();

    if (avgVol < 0.04){
      silenceFrames++;
    } else {
      if (silenceFrames > 20 && time - lastLoudTime > 1.5){
        lastLoudTime = time;
        if (autoMode) switchToRandomMode();
      }
      silenceFrames = 0;
    }

    if (volHistory.length === 90){
      const firstHalf = volHistory.slice(0,45).reduce((a,b)=>a+b,0)/45;
      const secondHalf = volHistory.slice(45).reduce((a,b)=>a+b,0)/45;
      if (firstHalf > 0.15 && secondHalf > 0.15 && Math.abs(firstHalf-secondHalf) / Math.max(firstHalf,secondHalf) > 0.55){
        if (time - lastLoudTime > 4){
          lastLoudTime = time;
          if (autoMode) switchToRandomMode();
          volHistory = [];
        }
      }
    }
  }

  function drawWaves(w,h,bass,mid,treb,pal){
    ctx.fillStyle = 'rgba(5,5,5,0.18)';
    ctx.fillRect(0,0,w,h);
    const cx=w/2, cy=h/2;
    for (let ring=0; ring<4; ring++){
      const amp = (bass*0.6+mid*0.4)*(70+ring*40);
      const baseR = 60+ring*70;
      ctx.beginPath();
      const points=64;
      for (let i=0;i<=points;i++){
        const angle=(i/points)*Math.PI*2;
        const freqIdx=Math.floor((i/points)*bufferLength*0.5);
        const val=dataArray[freqIdx]/255;
        const r=baseR+val*amp*0.5+Math.sin(angle*3+time*2)*12;
        const x=cx+Math.cos(angle)*r, y=cy+Math.sin(angle)*r;
        if(i===0)ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.closePath();
      const hue=(pal.hues[ring%pal.hues.length]+time*10)%360;
      ctx.strokeStyle='hsla('+hue+',85%,60%,0.8)';
      ctx.lineWidth=2+bass*5;
      ctx.stroke();
    }
    for (let line=0; line<3; line++){
      ctx.beginPath();
      const yOff=h/2+(line-1)*(h*0.18);
      for (let x=0;x<=w;x+=10){
        const idx=Math.floor((x/w)*bufferLength*0.7);
        const val=dataArray[idx]/255;
        const y=yOff+Math.sin(x*0.015+time*1.5+line)*(25+val*140);
        if(x===0)ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      const hue2=(pal.hues[(line+2)%pal.hues.length]+time*10)%360;
      ctx.strokeStyle='hsla('+hue2+',80%,55%,0.5)';
      ctx.lineWidth=1.5+treb*4;
      ctx.stroke();
    }
    if (bass>0.55 && Math.random()<0.5){
      for (let i=0;i<3;i++){
        particles.push({x:cx+(Math.random()-0.5)*150,y:cy+(Math.random()-0.5)*150,
          vx:(Math.random()-0.5)*8,vy:(Math.random()-0.5)*8,life:1,
          hue:(pal.hues[Math.floor(Math.random()*pal.hues.length)])});
      }
    }
    particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life-=0.02;
      ctx.beginPath(); ctx.arc(p.x,p.y,4*p.life,0,Math.PI*2);
      ctx.fillStyle='hsla('+p.hue+',90%,65%,'+Math.max(p.life,0)+')'; ctx.fill();});
    particles = particles.filter(p=>p.life>0);
  }

  function drawBlobs(w,h,bass,mid,treb,pal){
    ctx.fillStyle='rgba(5,5,7,0.12)';
    ctx.fillRect(0,0,w,h);
    blobs.forEach((b)=>{
      const bandStart=Math.floor(b.freqBand*bufferLength*0.6);
      const bandVal=dataArray[bandStart]/255;
      b.angle += b.speed*0.02*(0.5+bass*0.5);
      const x=b.baseX+Math.cos(b.angle+b.phase)*b.orbit*(0.5+mid);
      const y=b.baseY+Math.sin(b.angle*1.3+b.phase)*b.orbit*(0.5+mid);
      const r=b.baseR*(0.8+bandVal*0.9+bass*0.5);
      const hue=pal.hues[Math.floor(b.freqBand*pal.hues.length)];
      const grad=ctx.createRadialGradient(x,y,0,x,y,r);
      grad.addColorStop(0,'hsla('+hue+',80%,60%,'+(0.55+bandVal*0.3)+')');
      grad.addColorStop(1,'hsla('+hue+',80%,60%,0)');
      ctx.fillStyle=grad;
      ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    });
  }

  function drawCircles(w,h,bass,mid,treb,pal){
    ctx.fillStyle='rgba(5,5,7,0.35)';
    ctx.fillRect(0,0,w,h);
    const barCount=48;
    const step=Math.floor(bufferLength/barCount);
    const cx=w/2, cy=h/2;
    const innerR=Math.min(w,h)*0.12;
    const maxLen=Math.min(w,h)*0.35;
    const dotSize=Math.max(5, Math.min(w,h)*0.012);
    for (let i=0;i<barCount;i++){
      const val=dataArray[i*step]/255;
      const angle=(i/barCount)*Math.PI*2 - Math.PI/2;
      const towerLen=val*maxLen;
      const circleCount=Math.max(1,Math.floor(towerLen/(dotSize*2.2)));
      const dx=Math.cos(angle), dy=Math.sin(angle);
      const hue=pal.hues[i % pal.hues.length];
      for (let c=0;c<circleCount;c++){
        const r=innerR+c*(dotSize*2.2);
        ctx.beginPath();
        ctx.arc(cx+dx*r, cy+dy*r, dotSize, 0, Math.PI*2);
        ctx.fillStyle='hsla('+hue+',80%,60%,'+(0.9-c*0.02)+')';
        ctx.fill();
      }
    }
  }

  function drawKaleido(w,h,bass,mid,treb,pal){
    ctx.fillStyle=pal.bg;
    ctx.globalAlpha=0.15;
    ctx.fillRect(0,0,w,h);
    ctx.globalAlpha=1;
    const cx=w/2, cy=h/2;
    if (bass>0.5 && Math.random()<0.6){
      kParticles.push({baseAngle:Math.random()*(Math.PI/4),dist:10+Math.random()*30,
        speed:0.6+mid*3+Math.random()*0.6, size:4+bass*18+Math.random()*5,
        hue:pal.hues[Math.floor(Math.random()*pal.hues.length)], life:1,
        decay:0.005+Math.random()*0.005, wobble:Math.random()*Math.PI*2});
    }
    if (Math.random()<0.15+treb*0.3){
      kParticles.push({baseAngle:Math.random()*(Math.PI/4),dist:10+Math.random()*30,
        speed:0.6+mid*3+Math.random()*0.6, size:4+treb*10+Math.random()*4,
        hue:pal.hues[Math.floor(Math.random()*pal.hues.length)], life:1,
        decay:0.006+Math.random()*0.006, wobble:Math.random()*Math.PI*2});
    }
    const symmetry=8;
    kParticles.forEach(p=>{p.dist+=p.speed;p.wobble+=0.05;p.life-=p.decay;});
    kParticles = kParticles.filter(p=>p.life>0 && p.dist<Math.max(w,h)*0.8);
    kParticles.forEach(p=>{
      const wob=Math.sin(p.wobble)*5;
      const r=p.dist+wob;
      const baseX=Math.cos(p.baseAngle)*r, baseY=Math.sin(p.baseAngle)*r;
      const size=p.size*p.life, alpha=p.life*0.85;
      for (let s=0;s<symmetry;s++){
        const rot=(s/symmetry)*Math.PI*2;
        const mirror = s%2===1?-1:1;
        const x=baseX*Math.cos(rot)-(baseY*mirror)*Math.sin(rot);
        const y=baseX*Math.sin(rot)+(baseY*mirror)*Math.cos(rot);
        ctx.beginPath();
        ctx.arc(cx+x,cy+y,Math.max(size,0.5),0,Math.PI*2);
        ctx.fillStyle='hsla('+p.hue+',70%,55%,'+alpha+')';
        ctx.fill();
      }
    });
    ctx.beginPath();
    ctx.arc(cx,cy,8+bass*14,0,Math.PI*2);
    ctx.fillStyle='hsla('+pal.hues[0]+',70%,60%,0.6)';
    ctx.fill();
  }

  function draw(){
    rafId = requestAnimationFrame(draw);
    analyser.getByteFrequencyData(dataArray);
    const w = window.innerWidth, h = window.innerHeight;
    time += 0.016;

    let bassSum=0, midSum=0, trebSum=0;
    const third=Math.floor(bufferLength/3);
    for (let i=0;i<third;i++) bassSum+=dataArray[i];
    for (let i=third;i<third*2;i++) midSum+=dataArray[i];
    for (let i=third*2;i<bufferLength;i++) trebSum+=dataArray[i];
    const bass=(bassSum/third)/255;
    const mid=(midSum/third)/255;
    const treb=(trebSum/(bufferLength-third*2))/255;
    const avgVol=(bass+mid+treb)/3;

    detectSongChange(avgVol);

    const pal = palettes[paletteKey];

    if (currentMode==='waves') drawWaves(w,h,bass,mid,treb,pal);
    else if (currentMode==='blobs') drawBlobs(w,h,bass,mid,treb,pal);
    else if (currentMode==='circles') drawCircles(w,h,bass,mid,treb,pal);
    else drawKaleido(w,h,bass,mid,treb,pal);
  }
})();
</script>
</body>
</html>
